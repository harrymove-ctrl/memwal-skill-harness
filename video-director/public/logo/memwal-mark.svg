<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 28 28" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f1a"/>
      <stop offset="100%" stop-color="#06120f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="28" height="28" rx="6.5" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="26.5" height="26.5" rx="5.75" fill="none" stroke="#34d996" stroke-opacity="0.55" stroke-width="1.2"/>
  <!-- Pixel-dithered Walrus W Mark -->
  <g fill="#6ee7b7">
    <rect x="6" y="6" width="4" height="4"/>
    <rect x="18" y="6" width="4" height="4"/>
