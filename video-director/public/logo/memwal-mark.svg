    <rect x="10" y="10" width="8" height="6"/>
    <rect x="22" y="10" width="4" height="6"/>
  </g>
  <g fill="#10b981">
    <rect x="2" y="16" width="4" height="6"/>
    <rect x="10" y="16" width="8" height="6"/>
    <rect x="22" y="16" width="4" height="6"/>
  </g>
  <!-- Crisp top highlight pixels -->
  <g fill="#ecfdf5" fill-opacity="0.85">
    <rect x="6" y="6" width="4" height="1"/>
    <rect x="18" y="6" width="4" height="1"/>
    <rect x="10" y="10" width="8" height="1"/>
